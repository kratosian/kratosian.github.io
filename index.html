<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kratos Game Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(135deg, #1e293b, #312e81);
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 18px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .game {
            background: #1e293b;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.25s;
        }

        .game:hover {
            transform: translateY(-8px);
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .game h2 {
            margin-bottom: 10px;
        }

        .game p {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .play {
            display: inline-block;
            padding: 12px 25px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .play:hover {
            background: #818cf8;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 KRATOS GAME HUB</h1>
        <p>Kho game 2D của Kratosian</p>
    </header>

    <div class="container">

        <div class="games">

            <div class="game">
                <div class="game-icon">🕹️</div>

                <h2>Game 1</h2>

                <p>Game test</p>

                <a class="play" href="./game1/index.html">
                    CHAN ĐÊ
                </a>
            </div>


            <div class="game">
                <div class="game-icon">🚀</div>

                <h2>Game 2</h2>

                <p>Game mới sắp ra mắt</p>

                <a class="play" href="#">
                    CHAN ĐÊ
                </a>
            </div>


            <div class="game">
                <div class="game-icon">⚔️</div>

                <h2>Game 3</h2>

                <p>Đang phát triển...</p>

                <a class="play" href="#">
                    CHAN ĐÊ
                </a>
            </div>

        </div>

    </div>

    <footer>
        © 2026 Kratos Game Hub
    </footer>

</body>
</html>
