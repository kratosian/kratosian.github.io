<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game 2D - Võ Sĩ, Kiếm Sĩ, Pháp Sư, Cung Thủ</title>
    <!-- Thư viện PeerJS để hỗ trợ kết nối phòng online qua mã phòng -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #2c3e50, #bdc3c7);
        }
        .ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        h1 { margin-bottom: 20px; font-size: 32px; color: #f39c12; text-transform: uppercase; letter-spacing: 2px; }
        .btn-group { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        button, select, input {
            padding: 10px 20px;
            font-size: 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #c0392b; transform: translateY(-2px); }
        input, select { background: #2c3e50; border: 1px solid #7f8c8d; }
        .hidden { display: none !important; }
        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #bdc3c7;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Màn hình Menu chính -->
        <div id="main-menu" class="menu-screen">
            <h1>Đại Chiến 2D Online</h1>
            <div style="margin-bottom: 15px;">
                <label>Chọn lớp nhân vật: </label>
                <select id="char-select">
                    <option value="fighter">Võ Sĩ (Cận chiến mạnh)</option>
                    <option value="swordsman">Kiếm Sĩ (Tốc độ & Sải tay)</option>
                    <option value="mage">Pháp Sư (Phép tầm xa)</option>
                    <option value="archer">Cung Thủ (Bắn cung linh hoạt)</option>
                </select>
            </div>
            <div class="btn-group">
                <button onclick="startPVE()">Đấu với Máy (PVE)</button>
                <button onclick="showRoomMenu()">Chơi Online (P2P)</button>
            </div>
        </div>

        <!-- Màn hình tạo/vào phòng Online -->
        <div id="room-menu" class="menu-screen hidden">
            <h1>Phòng Trực Tuyến</h1>
            <div class="btn-group" style="flex-direction: column; align-items: center;">
                <button onclick="createRoom()" style="width: 220px;">Tạo Phòng Mới</button>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <input type="text" id="room-code-input" placeholder="Nhập mã 5 chữ số" maxlength="5" style="width: 150px; text-align: center;">
                    <button onclick="joinRoom()">Vào Phòng</button>
                </div>
            </div>
            <p id="room-status" style="margin-top: 15px; color: #f1c40f;"></p>
            <button onclick="backToMain()" style="margin-top: 20px; background: #7f8c8d;">Quay lại</button>
        </div>

        <!-- Giao diện trong trận đấu -->
        <div class="ui-overlay hidden" id="hud">
            <div>P1 HP: <span id="p1-hp">100</span></div>
            <div id="room-info">Mã phòng: <span id="display-room-code">----</span></div>
            <div>P2 HP: <span id="p2-hp">100</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="450" class="hidden"></canvas>
    </div>

    <div class="controls-hint">
        <b>Điều khiển (P1):</b> A/D để di chuyển | W để nhảy | J để tấn công / Dùng kỹ năng | K để lướt né
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = 'MENU'; // MENU, ROOM, PLAYING
        let gameMode = 'PVE'; // PVE hoặc PVP
        let peer = null, conn = null;
        let myId = '', roomCode = '';
        let isHost = false;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Khởi tạo thông số nhân vật theo lớp
        function createPlayer(x, y, type) {
            return {
                x: x, y: y, width: 40, height: 60,
                vx: 0, vy: 0, speed: 4, jumpForce: -11,
                isGrounded: false, hp: 100, maxHp: 100,
                type: type, facing: 1, // 1: phải, -1: trái
                isAttacking: false, attackCooldown: 0,
                color: type === 'fighter' ? '#e74c3c' : type === 'swordsman' ? '#3498db' : type === 'mage' ? '#9b59b6' : '#2ecc71',
                projectiles: []
            };
        }

        let player1, player2;

        function showRoomMenu() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('room-menu').classList.remove('hidden');
        }

        function backToMain() {
            document.getElementById('room-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startPVE() {
            gameMode = 'PVE';
            const charType = document.getElementById('char-select').value;
            player1 = createPlayer(100, 320, charType);
            player2 = createPlayer(660, 320, charType === 'fighter' ? 'swordsman' : 'fighter');
            startGameplay();
        }

        function startGameplay() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('room-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            canvas.classList.remove('hidden');
            gameState = 'PLAYING';
            requestAnimationFrame(gameLoop);
        }

        // Tạo mã phòng ngẫu nhiên gồm 5 chữ số
        function generateRoomCode() {
            return Math.floor(10000 + Math.random() * 90000).toString();
        }

        function createRoom() {
            isHost = true;
            roomCode = generateRoomCode();
            document.getElementById('room-status').innerText = 'Đang khởi tạo mã phòng...';
            
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                // Sử dụng mã phòng 5 số làm tiền tố hoặc ID kết nối
                document.getElementById('room-status').innerText = `Mã phòng của bạn: ${roomCode}. Đang đợi người chơi khác...`;
                document.getElementById('display-room-code').innerText = roomCode;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                gameMode = 'PVP';
                const charType = document.getElementById('char-select').value;
                player1 = createPlayer(100, 320, charType);
                player2 = createPlayer(660, 320, charType === 'fighter' ? 'swordsman' : 'fighter');
                startGameplay();
            });
        }

        function joinRoom() {
            isHost = false;
            roomCode = document.getElementById('room-code-input').value.trim();
            if (roomCode.length !== 5) {
                alert('Vui lòng nhập đúng mã phòng 5 chữ số!');
                return;
            }
            document.getElementById('room-status').innerText = 'Đang kết nối vào phòng...';

            peer = new Peer();
            peer.on('open', (id) => {
                // Kết nối tới Host (giả lập sử dụng ID ghép từ roomCode)
                // Trong môi trường thực tế, roomCode sẽ được ánh xạ qua server trung gian hoặc peer custom id
                conn = peer.connect(roomCode);
                setupConnection();
                gameMode = 'PVP';
                const charType = document.getElementById('char-select').value;
                player2 = createPlayer(100, 320, charType); // P2 là máy khách
                player1 = createPlayer(660, 320, 'fighter');
                startGameplay();
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (isHost) {
                    player2.x = data.x;
                    player2.y = data.y;
                    player2.hp = data.hp;
                    if (data.attacking) triggerAttack(player2);
                } else {
                    player1.x = data.x;
                    player1.y = data.y;
                    player1.hp = data.hp;
                    if (data.attacking) triggerAttack(player1);
                }
            });
        }

        function triggerAttack(p) {
            p.isAttacking = true;
            setTimeout(() => p.isAttacking = false, 200);
        }

        // Xử lý logic di chuyển và va chạm
        function updatePlayer(p) {
            p.vy += 0.5; // Trọng lực
            p.x += p.vx;
            p.y += p.vy;

            // Sàn nhà
            if (p.y > 320) {
                p.y = 320;
                p.vy = 0;
                p.isGrounded = true;
            }

            // Giới hạn biên màn hình
            if (p.x < 0) p.x = 0;
            if (p.x > canvas.width - p.width) p.x = canvas.width - p.width;

            if (p.attackCooldown > 0) p.attackCooldown--;
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Điều khiển Player 1
            player1.vx = 0;
            if (keys['a']) { player1.vx = -player1.speed; player1.facing = -1; }
            if (keys['d']) { player1.vx = player1.speed; player1.facing = 1; }
            if (keys['w'] && player1.isGrounded) { player1.vy = player1.jumpForce; player1.isGrounded = false; }
            
            if (keys['j'] && player1.attackCooldown === 0) {
                triggerAttack(player1);
                player1.attackCooldown = 30;
                // Kiểm tra trúng đòn P2
                if (Math.abs(player1.x - player2.x) < 60 && Math.abs(player1.y - player2.y) < 40) {
                    player2.hp = Math.max(0, player2.hp - 10);
                }
            }

            updatePlayer(player1);
            updatePlayer(player2);

            // AI đơn giản cho PVE
            if (gameMode === 'PVE') {
                if (player2.x > player1.x + 50) {
                    player2.vx = -2; player2.facing = -1;
                } else if (player2.x < player1.x - 50) {
                    player2.vx = 2; player2.facing = 1;
                } else {
                    player2.vx = 0;
                    if (Math.random() < 0.02 && player2.attackCooldown === 0) {
                        triggerAttack(player2);
                        player2.attackCooldown = 40;
                        if (Math.abs(player2.x - player1.x) < 60) {
                            player1.hp = Math.max(0, player1.hp - 5);
                        }
                    }
                }
            }

            // Đồng bộ dữ liệu qua mạng nếu chơi PVP
            if (gameMode === 'PVP' && conn && conn.open) {
                if (isHost) {
                    conn.send({ x: player1.x, y: player1.y, hp: player1.hp, attacking: player1.isAttacking });
                } else {
                    conn.send({ x: player2.x, y: player2.y, hp: player2.hp, attacking: player2.isAttacking });
                }
            }

            // Cập nhật thanh HP trên giao diện
            document.getElementById('p1-hp').innerText = player1.hp;
            document.getElementById('p2-hp').innerText = player2.hp;

            if (player1.hp <= 0 || player2.hp <= 0) {
                alert(player1.hp <= 0 ? "Player 2 Thắng!" : "Player 1 Thắng!");
                location.reload();
            }
        }

        // Vẽ đồ họa nhân vật & hiệu ứng chiêu thức
        function drawPlayer(p) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.width, p.height);

            // Vẽ mắt định hướng mặt nhân vật
            ctx.fillStyle = '#fff';
            let eyeX = p.facing === 1 ? p.x + 25 : p.x + 10;
            ctx.fillRect(eyeX, p.y + 15, 6, 6);

            // Hiệu ứng tấn công (Mô phỏng đòn đánh / chém / phép)
            if (p.isAttacking) {
                ctx.fillStyle = '#f1c40f';
                let atkX = p.facing === 1 ? p.x + p.width : p.x - 30;
                ctx.fillRect(atkX, p.y + 15, 30, 20);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ nền đất
            ctx.fillStyle = '#34495e';
            ctx.fillRect(0, 380, canvas.width, 70);

            drawPlayer(player1);
            drawPlayer(player2);
        }

        function gameLoop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
