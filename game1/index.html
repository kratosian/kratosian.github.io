<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikachu Onet Hardcore Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --border-color: #334155;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --grid-cols: 16;
            --grid-rows: 9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
        }

        .header-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 18px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .title-group h1 {
            font-size: 1.3rem;
            color: #fbbf24;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
            border-radius: 5px;
            transition: width 0.2s linear;
        }

        .controls-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            border: 1px solid #475569;
        }

        .btn:hover:not(:disabled) {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-accent {
            background: #d97706;
            border-color: #f59e0b;
        }
        .btn-accent:hover:not(:disabled) { background: #b45309; }

        .btn-danger {
            background: #dc2626;
            border-color: #ef4444;
        }

        .board-outer {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 8px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
            gap: 3px;
            position: relative;
            z-index: 2;
        }

        .tile {
            aspect-ratio: 1;
            width: min(52px, 5.3vw);
            height: min(52px, 5.3vw);
            background: #1e293b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s, background-color 0.15s;
            border: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .tile:hover {
            border-color: #38bdf8;
            transform: scale(1.05);
            z-index: 5;
        }

        .tile.selected {
            border-color: #f59e0b !important;
            background: #451a03 !important;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            animation: pulse 0.8s infinite alternate;
        }

        .tile.hint {
            border-color: #10b981 !important;
            animation: pulse-green 0.6s infinite alternate;
        }

        .tile.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .tile svg {
            width: 82%;
            height: 82%;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        #svg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .connector-path {
            fill: none;
            stroke: #ef4444;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px #ef4444);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 0.3s forwards;
        }

        @keyframes drawPath {
            to { stroke-dashoffset: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1.05); }
            100% { transform: scale(1.12); }
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 2px #10b981; }
            100% { box-shadow: 0 0 12px #10b981; }
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.6rem;
            color: #fbbf24;
            margin-bottom: 8px;
        }

        .modal-desc {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header-panel">
        <div class="title-group">
            ⚡ <span>Pikachu Hardcore</span>
        </div>

        <div class="stats-group">
            <div class="stat-item">
                <span class="stat-label">Màn</span>

<script>
// --- ÂM THANH (Web Audio API) ---
class SoundController {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    playTone(freq, duration, type="sine") {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }
    click() { this.playTone(600, 0.05); }
    select() { this.playTone(800, 0.08); }
    match() {
        this.playTone(523, 0.1);
        setTimeout(() => this.playTone(659, 0.1), 80);
        setTimeout(() => this.playTone(783, 0.15), 160);
    }
    shuffle() { this.playTone(300, 0.15, "sawtooth"); }
    win() {
        const notes = [440, 554, 659, 880];
        notes.forEach((n, i) => setTimeout(() => this.playTone(n, 0.2), i * 120));
    }
    fail() {
        this.playTone(300, 0.2, "square");
        setTimeout(() => this.playTone(200, 0.3, "square"), 200);
    }
}

// --- CẤU HÌNH GAME ---
const COLS = 16; 
const ROWS = 9;  
const TOTAL_TILES = COLS * ROWS; 

let board = []; 
let selectedTile = null;
let level = 1;
let score = 0;
let hints = 5;
let shuffles = 5;
let timer = null;
let timeLeft = 300; 
const MAX_TIME = 300;

// Element references
const gridEl = document.getElementById('grid-board');
const svgEl = document.getElementById('svg-canvas');
const timerBar = document.getElementById('timer-bar');
const levelTxt = document.getElementById('level-txt');
const scoreTxt = document.getElementById('score-txt');
const hintTxt = document.getElementById('hint-txt');
const shuffleTxt = document.getElementById('shuffle-txt');

// --- KHỞI TẠO GAME ---
function initGame() {
    gridEl.style.setProperty('--grid-cols', COLS);
    gridEl.style.setProperty('--grid-rows', ROWS);
    level = 1;
    score = 0;
    hints = 5;
    shuffles = 5;
    updateStats();
    startLevel();
}

function startLevel() {
    selectedTile = null;
    timeLeft = MAX_TIME;
    updateStats();
    generateBoard();
    startTimer();
}

function generateBoard() {
    let types = [];
    const numPairs = TOTAL_TILES / 2;
    for (let i = 0; i < numPairs; i++) {
        let type = i % POKEMON_DATA.length;
        types.push(type, type);
    }
    
    // Shuffle
    for (let i = types.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [types[i], types[j]] = [types[j], types[i]];
    }

    board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

    let idx = 0;
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            board[r][c] = types[idx++];
        }
    }

    // Đảm bảo ban đầu có ít nhất 1 nước đi
    if (!checkHasValidPair()) {
        shuffleBoard(false);
    }

    renderBoard();
}

function renderBoard() {
    gridEl.innerHTML = '';
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.r = r;
            tile.dataset.c = c;
            
            const type = board[r][c];
            if (type === -1) {
                tile.classList.add('empty');
            } else {
                tile.style.backgroundColor = POKEMON_DATA[type].bg;
                tile.innerHTML = POKEMON_DATA[type].svg;
                tile.addEventListener('click', () => handleTileClick(r, c));
            }
            gridEl.appendChild(tile);
        }
    }
}

// --- THUẬT TOÁN TÌM ĐƯỜNG NỐI (ONET CONNECT) ---
function checkMatch(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return null;
    if (board[r1][c1] !== board[r2][c2] || board[r1][c1] === -1) return null;

    // 1. Line Direct (1 đoạn)
    let path = checkLine(r1, c1, r2, c2);
    if (path) return path;

    // 2. L-Shape (2 đoạn)
    path = checkRect(r1, c1, r2, c2);
    if (path) return path;

    // 3. Z/U-Shape (3 đoạn)
    path = checkMore(r1, c1, r2, c2);
    if (path) return path;

    return null;
}

function checkLine(r1, c1, r2, c2) {
    if (r1 !== r2 && c1 !== c2) return null;
    if (r1 === r2) {
        let minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
        for (let c = minC + 1; c < maxC; c++) {
            if (board[r1][c] !== -1) return null;
        }
        return [{r: r1, c: c1}, {r: r2, c: c2}];
    } else {
        let minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
        for (let r = minR + 1; r < maxR; r++) {
            if (board[r][c1] !== -1) return null;
        }
        return [{r: r1, c: c1}, {r: r2, c: c2}];
    }
}

function checkRect(r1, c1, r2, c2) {
    // Góc 1: (r1, c2)
    if (board[r1][c2] === -1) {
        if (checkLine(r1, c1, r1, c2) && checkLine(r1, c2, r2, c2)) {
            return [{r: r1, c: c1}, {r: r1, c: c2}, {r: r2, c: c2}];
        }
    }
    // Góc 2: (r2, c1)
    if (board[r2][c1] === -1) {
        if (checkLine(r1, c1, r2, c1) && checkLine(r2, c1, r2, c2)) {
            return [{r: r1, c: c1}, {r: r2, c: c1}, {r: r2, c: c2}];
        }
    }
    return null;
}

function checkMore(r1, c1, r2, c2) {
    // Quét theo chiều ngang
    for (let c = 0; c <= COLS + 1; c++) {
        if (c === c1) continue;
        if (board[r1][c] === -1 || c === c1) {
            if (checkLine(r1, c1, r1, c)) {
                let rect = checkRect(r1, c, r2, c2);
                if (rect) return [{r: r1, c: c1}, ...rect];
            }
        }
    }
    // Quét theo chiều dọc
    for (let r = 0; r <= ROWS + 1; r++) {
        if (r === r1) continue;
        if (board[r][c1] === -1 || r === r1) {
            if (checkLine(r1, c1, r, c1)) {
                let rect = checkRect(r, c1, r2, c2);
                if (rect) return [{r: r1, c: c1}, ...rect];
            }
        }
    }
    return null;
}

// --- XỬ LÝ SỰ KIỆN CLICK ---
function handleTileClick(r, c) {
    if (board[r][c] === -1) return;

    clearHints();

    if (!selectedTile) {
        selectedTile = {r, c};
        getTileEl(r, c).classList.add('selected');
        audio.select();
    } else {
        if (selectedTile.r === r && selectedTile.c === c) {
            getTileEl(r, c).classList.remove('selected');
            selectedTile = null;
            audio.click();
            return;
        }

        const path = checkMatch(selectedTile.r, selectedTile.c, r, c);
        if (path) {
            // Nối thành công
            audio.match();
            drawPath(path);
            
            const prev = {...selectedTile};
            selectedTile = null;

            setTimeout(() => {
                clearPath();
                board[prev.r][prev.c] = -1;
                board[r][c] = -1;
                
                score += 100;
                updateStats();

                // Áp dụng cơ chế dồn ô theo Level
                applyGravity();
                renderBoard();

                if (checkWin()) {
                    handleWin();
                } else if (!checkHasValidPair()) {
                    autoShuffle();
                }
            }, 200);

        } else {
            // Nối thất bại
            audio.click();
            getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
            selectedTile = {r, c};
            getTileEl(r, c).classList.add('selected');
        }
    }
}

// --- VẼ ĐƯỜNG NỐI SVG ---
function drawPath(path) {
    svgEl.innerHTML = '';
    const rect = gridEl.getBoundingClientRect();
    const boardRect = document.querySelector('.board-outer').getBoundingClientRect();
    
    svgEl.setAttribute('width', boardRect.width);
    svgEl.setAttribute('height', boardRect.height);

    const cellWidth = rect.width / COLS;
    const cellHeight = rect.height / ROWS;
    const offsetX = rect.left - boardRect.left;
    const offsetY = rect.top - boardRect.top;

    let pointsStr = path.map(p => {
        let x = offsetX + (p.c - 0.5) * cellWidth;
        let y = offsetY + (p.r - 0.5) * cellHeight;
        return `${x},${y}`;
    }).join(' ');

    const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    polyline.setAttribute('points', pointsStr);
    polyline.setAttribute('class', 'connector-path');
    svgEl.appendChild(polyline);
}

function clearPath() {
    svgEl.innerHTML = '';
}

// --- CƠ CHẾ DỒN Ô THEO LEVEL (HARDCORE EXTENDED) ---
function applyGravity() {
    switch(level) {
        case 2: // Dồn xuống
            for (let c = 1; c <= COLS; c++) {
                let emptyRow = ROWS;
                for (let r = ROWS; r >= 1; r--) {
                    if (board[r][c] !== -1) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) board[r][c] = -1;
                        emptyRow--;
                    }
                }
            }
            break;
        case 3: // Dồn lên
            for (let c = 1; c <= COLS; c++) {
                let emptyRow = 1;
                for (let r = 1; r <= ROWS; r++) {
                    if (board[r][c] !== -1) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) board[r][c] = -1;
                        emptyRow++;
                    }
                }
            }
            break;
        case 4: // Dồn sang trái
            for (let r = 1; r <= ROWS; r++) {
                let emptyCol = 1;
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        board[r][emptyCol] = board[r][c];
                        if (emptyCol !== c) board[r][c] = -1;
                        emptyCol++;
                    }
                }
            }
            break;
        case 5: // Dồn sang phải
            for (let r = 1; r <= ROWS; r++) {
                let emptyCol = COLS;
                for (let c = COLS; c >= 1; c--) {
                    if (board[r][c] !== -1) {
                        board[r][emptyCol] = board[r][c];
                        if (emptyCol !== c) board[r][c] = -1;
                        emptyCol--;
                    }
                }
            }
            break;
        case 6: // Dồn vào giữa hàng (Split Horizontal)
            for (let r = 1; r <= ROWS; r++) {
                let leftVals = [], rightVals = [];
                let mid = COLS / 2;
                for (let c = 1; c <= mid; c++) if (board[r][c] !== -1) leftVals.push(board[r][c]);
                for (let c = mid + 1; c <= COLS; c++) if (board[r][c] !== -1) rightVals.push(board[r][c]);
                
                for (let c = 1; c <= COLS; c++) board[r][c] = -1;
                
                let idxL = mid - leftVals.length + 1;
                for (let val of leftVals) board[r][idxL++] = val;
                
                let idxR = mid + 1;
                for (let val of rightVals) board[r][idxR++] = val;
            }
            break;
        case 7: // Dồn ra 2 biên (Split Vertical)
            for (let c = 1; c <= COLS; c++) {
                let topVals = [], botVals = [];
                let mid = Math.floor(ROWS / 2);
                for (let r = 1; r <= mid; r++) if (board[r][c] !== -1) topVals.push(board[r][c]);
                for (let r = mid + 1; r <= ROWS; r++) if (board[r][c] !== -1) botVals.push(board[r][c]);
                
                for (let r = 1; r <= ROWS; r++) board[r][c] = -1;
                
                let idxT = 1;
                for (let val of topVals) board[r][idxT++] = val;
                
                let idxB = ROWS - botVals.length + 1;
                for (let val of botVals) board[r][idxB++] = val;
            }
            break;
    }
}

// --- HELPER & LOGIC KHÁC ---
function getTileEl(r, c) {
    return gridEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function checkHasValidPair() {
    let tiles = [];
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) tiles.push({r, c, type: board[r][c]});
        }
    }
    for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
            if (tiles[i].type === tiles[j].type) {
                if (checkMatch(tiles[i].r, tiles[i].c, tiles[j].r, tiles[j].c)) {
                    return {t1: tiles[i], t2: tiles[j]};
                }
            }
        }
    }
    return null;
}

function shuffleBoard(playSound = true) {
    let activeTypes = [];
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) activeTypes.push(board[r][c]);
        }
    }
    if (activeTypes.length === 0) return;

    do {
        for (let i = activeTypes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeTypes[i], activeTypes[j]] = [activeTypes[j], activeTypes[i]];
        }
        let idx = 0;
        for (let r = 1; r <= ROWS; r++) {
            for (let c = 1; c <= COLS; c++) {
                if (board[r][c] !== -1) board[r][c] = activeTypes[idx++];
            }
        }
    } while (!checkHasValidPair() && activeTypes.length > 2);

    if (playSound) audio.shuffle();
    renderBoard();
}

function autoShuffle() {
    if (shuffles > 0) {
        shuffles--;
        updateStats();
        shuffleBoard();
    } else {
        handleGameOver("Bế tắc! Bạn đã hết lượt đổi hình.");
    }
}

function clearHints() {
    document.querySelectorAll('.tile.hint').forEach(el => el.classList.remove('hint'));
}

function checkWin() {
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) return false;
        }
    }
    return true;
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        timerBar.style.width = `${(timeLeft / MAX_TIME) * 100}%`;
        if (timeLeft <= 0) {
            clearInterval(timer);
            handleGameOver("Hết giờ rồi!");
        }
    }, 1000);
}

function updateStats() {
    levelTxt.textContent = level;
    scoreTxt.textContent = score;
    hintTxt.textContent = hints;
    shuffleTxt.textContent = shuffles;
}

function handleWin() {
    clearInterval(timer);
    audio.win();
    showModal(`HOÀN THÀNH MÀN ${level}!`, `Điểm của bạn: ${score}`, () => {
        level++;
        startLevel();
    });
}

function handleGameOver(reason) {
    clearInterval(timer);
    audio.fail();
    showModal("GAME OVER", `${reason}\nTổng điểm: ${score}`, () => {
        initGame();
    });
}

function showModal(title, desc, onBtnClick) {
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').innerText = desc;
    const btn = document.getElementById('modal-btn');
    
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    
    newBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        onBtnClick();
    });
    modal.classList.add('active');
}

// --- SU KIEN BUTTON ---
document.getElementById('btn-hint').addEventListener('click', () => {
    if (hints <= 0) return;
    const pair = checkHasValidPair();
    if (pair) {
        hints--;
        updateStats();
        clearHints();
        getTileEl(pair.t1.r, pair.t1.c).classList.add('hint');
        getTileEl(pair.t2.r, pair.t2.c).classList.add('hint');
        audio.select();
    }
});

document.getElementById('btn-shuffle').addEventListener('click', () => {
    if (shuffles <= 0) return;
    shuffles--;
    updateStats();
    shuffleBoard();
});

document.getElementById('btn-restart').addEventListener('click', () => {
    initGame();
});

// Chạy game
initGame();
</script>
