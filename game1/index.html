<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kratos 1v1 Fighting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .game-container { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; background: #1e293b; }
    
    .ui-layer {
      position: absolute; top: 20px; left: 40px; right: 40px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .status-group { width: 38%; max-width: 450px; }
    .bar-container {
      width: 100%; height: 24px;
      background: rgba(51, 65, 85, 0.8);
      border: 2px solid #ffffff; border-radius: 6px;
      overflow: hidden; margin-bottom: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .mp-container { height: 14px; border-color: #94a3b8; }
    .health-bar { height: 100%; width: 100%; transition: width 0.1s ease; }
    .mana-bar { height: 100%; width: 0%; transition: width 0.1s ease; background: #a855f7; }
    #p1-hp { background: #ef4444; }
    #p2-hp { background: #3b82f6; float: right; }
    #p2-mp { float: right; }
    
    .vs-logo {
      font-size: 28px; font-weight: 900; color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); margin-top: 5px;
    }

    .controls-info {
      position: absolute; bottom: 15px; left: 50%;
      transform: translateX(-50%); font-size: 13px;
      color: rgba(255, 255, 255, 0.7); text-align: center;
      line-height: 1.5; background: rgba(15, 23, 42, 0.6);
      padding: 8px 18px; border-radius: 20px; backdrop-filter: blur(4px);
      z-index: 10; pointer-events: none;
    }

    #game-over {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      padding: 40px 60px; border-radius: 16px;
      border: 2px solid #38bdf8; text-align: center;
      display: none; z-index: 20;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
    }
    button {
      margin-top: 20px; padding: 12px 28px;
      background: #38bdf8; border: none; color: #0f172a;
      font-size: 16px; font-weight: bold; border-radius: 8px;
      cursor: pointer; transition: transform 0.1s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="ui-layer">
      <div class="status-group">
        <div style="font-weight:bold; font-size: 18px; margin-bottom:6px; color:#ef4444; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">P1: VÕ SĨ</div>
        <div class="bar-container"><div id="p1-hp" class="health-bar"></div></div>
        <div class="bar-container mp-container"><div id="p1-mp" class="mana-bar"></div></div>
      </div>

      <div class="vs-logo">VS</div>

      <div class="status-group">
        <div style="font-weight:bold; font-size: 18px; margin-bottom:6px; color:#3b82f6; text-align:right; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">P2: KIẾM SĨ</div>
        <div class="bar-container"><div id="p2-hp" class="health-bar"></div></div>
        <div class="bar-container mp-container"><div id="p2-mp" class="mana-bar"></div></div>
      </div>
    </div>

    <div id="game-over">
      <h1 id="winner-text" style="color: #facc15; font-size: 36px; margin-bottom: 10px;">P1 THẮNG!</h1>
      <button onclick="resetGame()">CHƠI LẠI</button>
    </div>

    <div class="controls-info">
      <b>P1:</b> A/D (Di chuyển), W (Nhảy) | U (Tấn công - Cộng MP), I/O/P (Chiêu)<br>
      <b>P2:</b> Phím mũi tên (Di chuyển/Nhảy) | Num 1 (Tấn công - Cộng MP), Num 2/3/4 (Chiêu)
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const gravity = 0.8;

    // Ảnh mẫu trực tuyến tách nền sẵn chuẩn đẹp
    const imgP1 = new Image();
    let p1Loaded = false;
    imgP1.src = 'p1.png';
    imgP1.onerror = () => {
      // Nếu chưa có file p1.png trong repo thì dùng tạm link ảnh online này
      imgP1.src = 'https://raw.githubusercontent.com/taniarascia/sandbox/master/gh-pages/sprites/ken.png';
    };
    imgP1.onload = () => { p1Loaded = true; };

    const imgP2 = new Image();
    let p2Loaded = false;
    imgP2.src = 'p2.png';
    imgP2.onerror = () => {
      // Nếu chưa có file p2.png trong repo thì dùng tạm link ảnh online này
      imgP2.src = 'https://raw.githubusercontent.com/taniarascia/sandbox/master/gh-pages/sprites/ryu.png';
    };
    imgP2.onload = () => { p2Loaded = true; };

    class Player {
      constructor({ x, facing, hpId, mpId, color, imgObj, isP1 }) {
        this.x = x;
        this.y = 100;
        this.width = 80;
        this.height = 130;
        this.velocity = { x: 0, y: 0 };
        this.facing = facing;
        this.hp = 100;
        this.mp = 0;
        this.hpId = hpId;
        this.mpId = mpId;
        this.color = color;
        this.imgObj = imgObj;
        this.isP1 = isP1;
        this.isAttacking = false;
        this.attackBox = { x: 0, y: 0, width: 80, height: 50 };
      }

      draw() {
        const isLoaded = this.isP1 ? p1Loaded : p2Loaded;

        if (isLoaded) {
          ctx.save();
          if (this.facing === 'left') {
            ctx.translate(this.x + this.width, this.y);
            ctx.scale(-1, 1);
            ctx.drawImage(this.imgObj, 0, 0, this.width, this.height);
          } else {
            ctx.drawImage(this.imgObj, this.x, this.y, this.width, this.height);
          }
          ctx.restore();
        } else {
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }

        if (this.isAttacking) {
          ctx.fillStyle = 'rgba(255, 230, 0, 0.6)';
          const boxX = this.facing === 'right' ? this.x + this.width : this.x - this.attackBox.width;
          ctx.fillRect(boxX, this.y + 35, this.attackBox.width, this.attackBox.height);
        }
      }

      update() {
        const groundY = canvas.height - 60;

        this.x += this.velocity.x;
        this.y += this.velocity.y;

        if (this.y + this.height + this.velocity.y >= groundY) {
          this.velocity.y = 0;
          this.y = groundY - this.height;
        } else {
          this.velocity.y += gravity;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        this.draw();
      }

      attack(boxWidth = 80, costMP = 0) {
        if (this.isAttacking || this.mp < costMP) return false;
        this.mp -= costMP;
        this.updateUI();
        this.isAttacking = true;
        this.attackBox.width = boxWidth;
        setTimeout(() => { this.isAttacking = false; }, 200);
        return true;
      }

      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        this.mp = Math.min(100, this.mp + 10);
        this.updateUI();
      }

      updateUI() {
        document.getElementById(this.hpId).style.width = this.hp + '%';
        document.getElementById(this.mpId).style.width = this.mp + '%';
      }
    }

    const player1 = new Player({ 
      x: canvas.width * 0.2, 
      facing: 'right', 
      hpId: 'p1-hp', 
      mpId: 'p1-mp', 
      color: '#ef4444',
      imgObj: imgP1,
      isP1: true
    });

    const player2 = new Player({ 
      x: canvas.width * 0.75, 
      facing: 'left', 
      hpId: 'p2-hp', 
      mpId: 'p2-mp', 
      color: '#3b82f6',
      imgObj: imgP2,
      isP1: false
    });

    const keys = { a: false, d: false, w: false, ArrowLeft: false, ArrowRight: false, ArrowUp: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      if (e.key === 'u' || e.key === 'U') { if (player1.attack(80, 0)) checkHit(player1, player2, 10); }
      if (e.key === 'i' || e.key === 'I') { if (player1.attack(120, 30)) checkHit(player1, player2, 20); }
      if (e.key === 'o' || e.key === 'O') { if (player1.attack(160, 50)) checkHit(player1, player2, 30); }
      if (e.key === 'p' || e.key === 'P') { if (player1.attack(220, 80)) checkHit(player1, player2, 50); }

      if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
      if (e.key === 'ArrowRight') keys.ArrowRight = true;
      if (e.key === 'ArrowUp') keys.ArrowUp = true;
      if (e.key === '1') { if (player2.attack(80, 0)) checkHit(player2, player1, 10); }
      if (e.key === '2') { if (player2.attack(120, 30)) checkHit(player2, player1, 20); }
      if (e.key === '3') { if (player2.attack(160, 50)) checkHit(player2, player1, 30); }
      if (e.key === '4') { if (player2.attack(220, 80)) checkHit(player2, player1, 50); }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'w' || e.key === 'W') keys.w = false;
      if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
      if (e.key === 'ArrowRight') keys.ArrowRight = false;
      if (e.key === 'ArrowUp') keys.ArrowUp = false;
    });

    function checkHit(attacker, defender, damage) {
      const boxX = attacker.facing === 'right' ? attacker.x + attacker.width : attacker.x - attacker.attackBox.width;
      if (boxX < defender.x + defender.width && boxX + attacker.attackBox.width > defender.x) {
        defender.takeDamage(damage);
        attacker.mp = Math.min(100, attacker.mp + 15);
        attacker.updateUI();

        if (defender.hp === 0) {
          document.getElementById('winner-text').innerText = (attacker === player1 ? 'P1' : 'P2') + ' THẮNG!';
          document.getElementById('game-over').style.display = 'block';
        }
      }
    }

    function resetGame() {
      player1.hp = 100; player1.mp = 0; player1.x = canvas.width * 0.2;
      player2.hp = 100; player2.mp = 0; player2.x = canvas.width * 0.75;
      player1.updateUI(); player2.updateUI();
      document.getElementById('game-over').style.display = 'none';
      animate();
    }

    function animate() {
      const animId = requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const groundY = canvas.height - 60;
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, groundY, canvas.width, 60);

      player1.velocity.x = keys.a ? -6 : (keys.d ? 6 : 0);
      if (keys.a) player1.facing = 'left';
      if (keys.d) player1.facing = 'right';
      if (keys.w && player1.y + player1.height >= groundY) player1.velocity.y = -16;

      player2.velocity.x = keys.ArrowLeft ? -6 : (keys.ArrowRight ? 6 : 0);
      if (keys.ArrowLeft) player2.facing = 'left';
      if (keys.ArrowRight) player2.facing = 'right';
      if (keys.ArrowUp && player2.y + player2.height >= groundY) player2.velocity.y = -16;

      player1.update();
      player2.update();

      if (player1.hp === 0 || player2.hp === 0) cancelAnimationFrame(animId);
    }

    animate();
  </script>
</body>
</html>
