<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đối Kháng 2D - Sprite Sheet Demo</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid #ffffff;
            background-color: #333333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .instructions {
            margin-top: 15px;
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h2>Đấu Trường Pixel 2D</h2>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="instructions">
        <b>Điều khiển:</b> Dùng phím mũi tên <b>Trái / Phải</b> để di chuyển | Nhấn phím <b>Space (Cách)</b> để tung đòn đánh!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Khởi tạo hình ảnh sprite sheet
        const fighterImage = new Image();
        fighterImage.src = 'hero.jpg'; // Đảm bảo tên file ảnh trùng với file bạn đang có

        class Fighter {
            constructor() {
                this.x = 100;
                this.y = 240;
                this.width = 96;   // Kích thước hiển thị trên canvas
                this.height = 96;
                this.vx = 0;
                
                // Trạng thái nhân vật: 'idle' (đứng), 'walk' (đi), 'attack' (đấm/đá)
                this.state = 'idle'; 
                this.currentFrame = 0;
                this.frameTimer = 0;
                this.frameInterval = 8; // Tốc độ chuyển khung (số frame màn hình, càng nhỏ càng nhanh)
                
                // Cấu hình dòng (row) và số lượng khung hình (frames) tương ứng trên sprite sheet
                this.animations = {
                    idle: { row: 0, frames: 4 },
                    walk: { row: 1, frames: 4 },
                    attack: { row: 2, frames: 4 }
                };
            }

            update() {
                // Cập nhật tọa độ di chuyển ngang
                this.x += this.vx;
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;

                // Xử lý chuyển đổi khung hình animation mượt mà
                this.frameTimer++;
                if (this.frameTimer >= this.frameInterval) {
                    this.frameTimer = 0;
                    const maxFrames = this.animations[this.state].frames;
                    this.currentFrame = (this.currentFrame + 1) % maxFrames;
                }
            }

            draw(ctx) {
                const anim = this.animations[this.state];
                
                // Tính toán kích thước cắt trên ảnh gốc dựa theo lưới
                const srcWidth = fighterImage.width > 0 ? fighterImage.width / 4 : 100;
                const srcHeight = fighterImage.height > 0 ? fighterImage.height / 4 : 100;
                
                const sourceX = this.currentFrame * srcWidth;
                const sourceY = anim.row * srcHeight;

                if (fighterImage.complete && fighterImage.naturalWidth !== 0) {
                    ctx.drawImage(
                        fighterImage,
                        sourceX, sourceY, srcWidth, srcHeight, // Vùng cắt từ ảnh gốc
                        this.x, this.y, this.width, this.height // Vùng hiển thị trên canvas
                    );
                } else {
                    // Hiển thị khung tạm thời nếu ảnh chưa load xong
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
            }
        }

        const player = new Fighter();

        // Lắng nghe sự kiện bàn phím
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                player.state = 'attack';
                player.currentFrame = 0; // Đưa về khung đòn đánh đầu tiên
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'Space') {
                player.state = 'idle';
            }
        });

        function handleInput() {
            if (keys['ArrowRight']) {
                player.vx = 4;
                if (player.state !== 'attack') player.state = 'walk';
            } else if (keys['ArrowLeft']) {
                player.vx = -4;
                if (player.state !== 'attack') player.state = 'walk';
            } else {
                player.vx = 0;
                if (player.state !== 'attack') player.state = 'idle';
            }
        }

        // Vòng lặp game (Game Loop)
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            handleInput();
            player.update();
            player.draw(ctx);

            requestAnimationFrame(gameLoop);
        }

        // Chạy game khi ảnh đã tải hoàn tất vào bộ nhớ
        fighterImage.onload = () => {
            gameLoop();
        };
    </script>
</body>
</html>
