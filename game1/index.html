<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pikachu Onet - Animals Edition</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.85);
            --border-color: #334155;
            --text-color: #f8fafc;
            --accent-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --grid-cols: 16;
            --grid-rows: 9;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 8px;
        }

        /* --- START MENU OVERLAY --- */
        .start-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            gap: 20px;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            letter-spacing: 2px;
            text-align: center;
        }

        .start-subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
        }

        .btn-start-game {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-start-game:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 30px rgba(245, 158, 11, 0.6);
        }

        /* --- GAME MAIN WRAPPER --- */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 1100px;
        }

        .header-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 18px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .title-group h1 {
            font-size: 1.2rem;
            color: #fbbf24;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: #334155;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
            border-radius: 5px;
            transition: width 0.2s linear;
        }

        .controls-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            border: 1px solid #475569;
        }

        .btn:hover:not(:disabled) {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-accent { background: #d97706; border-color: #f59e0b; }
        .btn-accent:hover:not(:disabled) { background: #b45309; }
        .btn-danger { background: #dc2626; border-color: #ef4444; }

        .select-music {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .board-outer {
            position: relative;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 8px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
            gap: 3px;
            position: relative;
            z-index: 2;
        }

        .tile {
            aspect-ratio: 1;
            width: min(52px, 5.3vw);
            height: min(52px, 5.3vw);
            background: #1e293b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s, background-color 0.15s;
            border: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .tile:hover {
            border-color: #38bdf8;
            transform: scale(1.05);
            z-index: 5;
        }

        .tile.selected {
            border-color: #f59e0b !important;
            background: #451a03 !important;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            animation: pulse 0.8s infinite alternate;
        }

        .tile.hint {
            border-color: #10b981 !important;
            animation: pulse-green 0.6s infinite alternate;
        }

        .tile.empty {
            visibility: hidden;
            pointer-events: none;
        }

        .tile svg {
            width: 82%;
            height: 82%;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
        }

        #svg-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .connector-path {
            fill: none;
            stroke: #ef4444;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px #ef4444);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawPath 0.3s forwards;
        }

        @keyframes drawPath { to { stroke-dashoffset: 0; } }
        @keyframes pulse { 0% { transform: scale(1.05); } 100% { transform: scale(1.12); } }
        @keyframes pulse-green { 0% { box-shadow: 0 0 2px #10b981; } 100% { box-shadow: 0 0 12px #10b981; } }

        /* --- MODAL OVERLAY --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }
        .modal-title { font-size: 1.6rem; color: #fbbf24; margin-bottom: 8px; }
        .modal-desc { color: #94a3b8; margin-bottom: 20px; font-size: 0.95rem; }
    </style>
</head>

<!-- MÀN HÌNH CHỜ BẮT ĐẦU GAME -->
<div class="start-screen" id="start-screen">
    <div class="start-title">🐾 ONET ANIMALS 🐾</div>
    <div class="start-subtitle">Thách thức trí nhớ & Tốc độ nối hình con vật!</div>
    <button class="btn-start-game" id="btn-start">▶ VÀO GAME</button>
</div>

<!-- GIAO DIỆN GAME CHÍNH -->
<div class="game-wrapper">

        </div>

                <span class="stat-label">Gợi ý</span>

            </div>
            <div class="stat-item">
                <span class="stat-label">Đổi hình</span>
                <span class="stat-value" id="shuffle-txt">5</span>

        <div class="controls-group">
            <!-- Nhạc nền selection -->
            <select class="select-music" id="music-select">
                <option value="1">🎵 Nhạc 1: Retro Chill</option>
                <option value="2">🎵 Nhạc 2: Arcade Fast</option>

        <div class="timer-container">

    <div class="board-outer">

    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h2 class="modal-title" id="modal-title">CHIẾN THẮNG!</h2>
        <p class="modal-desc" id="modal-desc">Bạn đã hoàn thành màn chơi!</p>
        <button class="btn btn-accent" id="modal-btn" style="width:100%; justify-content:center; padding: 10px;">TIẾP TỤC</button>
    </div>

// --- HỆ THỐNG ÂM THANH & NHẠC NỀN SYNTHESIZER ---
class SoundController {
    constructor() {
        this.ctx = null;
        this.musicTimer = null;
        this.isMuted = false;
        this.currentTrack = 1;
        this.noteIndex = 0;
    }

    initCtx() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, duration, type="sine", volume=0.1) {
        if (this.isMuted || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    click() { this.playTone(600, 0.05); }
    select() { this.playTone(800, 0.08); }
    match() {
        this.playTone(523, 0.08);
        setTimeout(() => this.playTone(659, 0.08), 70);
        setTimeout(() => this.playTone(783, 0.12), 140);
    }
    shuffle() { this.playTone(300, 0.12, "sawtooth"); }
    win() {
        const notes = [440, 554, 659, 880];
        notes.forEach((n, i) => setTimeout(() => this.playTone(n, 0.2), i * 120));
    }
    fail() {
        this.playTone(300, 0.2, "square");
        setTimeout(() => this.playTone(200, 0.3, "square"), 200);
    }

    startMusic() {
        this.initCtx();
        if (this.musicTimer) clearInterval(this.musicTimer);
        this.noteIndex = 0;
        
        const tracks = {
            1: { bpm: 220, notes: [261.6, 329.6, 392, 523.2, 392, 329.6, 293.7, 349.2, 440, 587.3, 440, 349.2] },
            2: { bpm: 150, notes: [523.2, 587.3, 659.3, 783.9, 659.3, 587.3, 523.2, 392, 440, 523.2, 659.3, 523.2] },
            3: { bpm: 180, notes: [220, 233.1, 246.9, 261.6, 246.9, 233.1, 220, 196, 220, 261.6, 220, 196] }
        };

        const current = tracks[this.currentTrack];
        this.musicTimer = setInterval(() => {
            if (!this.isMuted) {
                const note = current.notes[this.noteIndex % current.notes.length];
                this.playTone(note, 0.15, "triangle", 0.03);
                this.noteIndex++;
            }
        }, current.bpm);
    }

    stopMusic() {
        if (this.musicTimer) clearInterval(this.musicTimer);
    }
}

    { bg: '#581c87', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="42" r="32" fill="#c084fc"/><circle cx="38" cy="40" r="5" fill="#fff"/><circle cx="62" cy="40" r="5" fill="#fff"/><circle cx="38" cy="40" r="2" fill="#000"/><circle cx="62" cy="40" r="2" fill="#000"/><path d="M 20 70 Q 25 85 30 70 Q 35 85 40 70 Q 45 85 50 70 Q 55 85 60 70 Q 65 85 70 70 Q 75 85 80 70" stroke="#c084fc" stroke-width="6" fill="none"/></svg>` },

    { bg: '#713f12', svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="22" fill="#facc15"/><line x1="40" y1="28" x2="40" y2="72" stroke="#000" stroke-width="6"/><line x1="55" y1="28" x2="55" y2="72" stroke="#000" stroke-width="6"/><circle cx="30" cy="45" r="3" fill="#000"/><ellipse cx="45" cy="22" rx="12" ry="8" fill="#e0f2fe"/><ellipse cx="60" cy="22" rx="12" ry="8" fill="#e0f2fe"/></svg>` },

    { bg: '#4c1d95', svg: `<svg viewBox="0 0 100 100"><ellipse cx="30" cy="35" rx="18" ry="14" fill="#f472b6"/><ellipse cx="70" cy="35" rx="18" ry="14" fill="#f472b6"/><ellipse cx="32" cy="60" rx="14" ry="10" fill="#fb7185"/><ellipse cx="68" cy="60" rx="14" ry="10" fill="#fb7185"/><ellipse cx="50" cy="50" rx="5" ry="25" fill="#000"/></svg>` },
    // 20. Chim Én
    { bg: '#0369a1', svg: `<svg viewBox="0 0 100 100"><path d="M 10 40 Q 50 10 90 40 Q 50 45 10 40 Z" fill="#0284c7"/><circle cx="50" cy="45" r="12" fill="#0284c7"/><polygon points="50,55 45,75 55,75" fill="#0284c7"/><circle cx="46" cy="42" r="2" fill="#fff"/><circle cx="54" cy="42" r="2" fill="#fff"/></svg>` },
    // 21. Cáo Ngựa / Ngựa
    { bg: '#78350f', svg: `<svg viewBox="0 0 100 100"><path d="M 30 75 L 30 40 L 60 25 L 75 35 L 55 50 L 55 75 Z" fill="#b45309"/><circle cx="62" cy="32" r="3" fill="#000"/><path d="M 30 35 Q 20 45 25 65" stroke="#451a03" stroke-width="6" fill="none"/></svg>` },
    // 22. Sâu Róm / Sâu
    { bg: '#365314', svg: `<svg viewBox="0 0 100 100"><circle cx="25" cy="55" r="12" fill="#84cc16"/><circle cx="42" cy="55" r="12" fill="#65a30d"/><circle cx="59" cy="55" r="12" fill="#4d7c0f"/><circle cx="75" cy="50" r="14" fill="#84cc16"/><circle cx="78" cy="45" r="2" fill="#000"/></svg>` },
    // 23. Cá Thần Tiên Cá Cảnh / Cá Vàng
    { bg: '#c2410c', svg: `<svg viewBox="0 0 100 100"><circle cx="45" cy="50" r="25" fill="#f97316"/><polygon points="70,50 90,30 85,50 90,70" fill="#ea580c"/><circle cx="32" cy="42" r="4" fill="#fff"/><circle cx="32" cy="42" r="2" fill="#000"/></svg>` },
    // 24. Chuột
    { bg: '#3f3f46', svg: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="22" fill="#71717a"/><circle cx="30" cy="35" r="12" fill="#f472b6"/><circle cx="30" cy="35" r="8" fill="#71717a"/><circle cx="60" cy="50" r="3" fill="#000"/><circle cx="75" cy="55" r="4" fill="#f472b6"/></svg>` }
];

// --- LOGIC GAME ---
const COLS = 16;
const ROWS = 9;
const TOTAL_TILES = COLS * ROWS;

let board = [];
let selectedTile = null;
let level = 1;
let score = 0;
let hints = 5;
let shuffles = 5;
let timer = null;
let timeLeft = 300;
const MAX_TIME = 300;

const gridEl = document.getElementById('grid-board');
const svgEl = document.getElementById('svg-canvas');
const timerBar = document.getElementById('timer-bar');
const levelTxt = document.getElementById('level-txt');
const scoreTxt = document.getElementById('score-txt');
const hintTxt = document.getElementById('hint-txt');
const shuffleTxt = document.getElementById('shuffle-txt');

// --- BẮT ĐẦU GAME TỪ START MENU ---
document.getElementById('btn-start').addEventListener('click', () => {
    document.getElementById('start-screen').classList.add('hidden');
    audio.startMusic();
    initGame();
});

// --- NHẠC NỀN EVENT LISTENERS ---
const musicSelect = document.getElementById('music-select');
const btnMusicToggle = document.getElementById('btn-music-toggle');

musicSelect.addEventListener('change', (e) => {
    audio.currentTrack = parseInt(e.target.value);
    audio.startMusic();
});

btnMusicToggle.addEventListener('click', () => {
    audio.isMuted = !audio.isMuted;
    btnMusicToggle.textContent = audio.isMuted ? "🔇 Muted" : "🔊 Sound ON";
});

function initGame() {
    gridEl.style.setProperty('--grid-cols', COLS);
    gridEl.style.setProperty('--grid-rows', ROWS);
    level = 1;
    score = 0;
    hints = 5;
    shuffles = 5;
    updateStats();
    startLevel();
}

function startLevel() {
    selectedTile = null;
    timeLeft = MAX_TIME;
    updateStats();
    generateBoard();
    startTimer();
}

function generateBoard() {
    let types = [];
    const numPairs = TOTAL_TILES / 2;
    for (let i = 0; i < numPairs; i++) {
        let type = i % ANIMAL_DATA.length;
        types.push(type, type);
    }
    
    for (let i = types.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [types[i], types[j]] = [types[j], types[i]];
    }

    board = Array(ROWS + 2).fill(0).map(() => Array(COLS + 2).fill(-1));

    let idx = 0;
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            board[r][c] = types[idx++];
        }
    }

    if (!checkHasValidPair()) shuffleBoard(false);
    renderBoard();
}

function renderBoard() {
    gridEl.innerHTML = '';
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.r = r;
            tile.dataset.c = c;
            
            const type = board[r][c];
            if (type === -1) {
                tile.classList.add('empty');
            } else {
                tile.style.backgroundColor = ANIMAL_DATA[type].bg;
                tile.innerHTML = ANIMAL_DATA[type].svg;
                tile.addEventListener('click', () => handleTileClick(r, c));
            }
            gridEl.appendChild(tile);
        }
    }
}

// --- ONET ALGORITHM ---
function checkMatch(r1, c1, r2, c2) {
    if (r1 === r2 && c1 === c2) return null;
    if (board[r1][c1] !== board[r2][c2] || board[r1][c1] === -1) return null;

    let path = checkLine(r1, c1, r2, c2);
    if (path) return path;

    path = checkRect(r1, c1, r2, c2);
    if (path) return path;

    path = checkMore(r1, c1, r2, c2);
    if (path) return path;

    return null;
}

function checkLine(r1, c1, r2, c2) {
    if (r1 !== r2 && c1 !== c2) return null;
    if (r1 === r2) {
        let minC = Math.min(c1, c2), maxC = Math.max(c1, c2);
        for (let c = minC + 1; c < maxC; c++) {
            if (board[r1][c] !== -1) return null;
        }
        return [{r: r1, c: c1}, {r: r2, c: c2}];
    } else {
        let minR = Math.min(r1, r2), maxR = Math.max(r1, r2);
        for (let r = minR + 1; r < maxR; r++) {
            if (board[r][c1] !== -1) return null;
        }
        return [{r: r1, c: c1}, {r: r2, c: c2}];
    }
}

function checkRect(r1, c1, r2, c2) {
    if (board[r1][c2] === -1 && checkLine(r1, c1, r1, c2) && checkLine(r1, c2, r2, c2)) {
        return [{r: r1, c: c1}, {r: r1, c: c2}, {r: r2, c: c2}];
    }
    if (board[r2][c1] === -1 && checkLine(r1, c1, r2, c1) && checkLine(r2, c1, r2, c2)) {
        return [{r: r1, c: c1}, {r: r2, c: c1}, {r: r2, c: c2}];
    }
    return null;
}

function checkMore(r1, c1, r2, c2) {
    for (let c = 0; c <= COLS + 1; c++) {
        if (c === c1) continue;
        if (board[r1][c] === -1 || c === c1) {
            if (checkLine(r1, c1, r1, c)) {
                let rect = checkRect(r1, c, r2, c2);
                if (rect) return [{r: r1, c: c1}, ...rect];
            }
        }
    }
    for (let r = 0; r <= ROWS + 1; r++) {
        if (r === r1) continue;
        if (board[r][c1] === -1 || r === r1) {
            if (checkLine(r1, c1, r, c1)) {
                let rect = checkRect(r, c1, r2, c2);
                if (rect) return [{r: r1, c: c1}, ...rect];
            }
        }
    }
    return null;
}

function handleTileClick(r, c) {
    if (board[r][c] === -1) return;
    clearHints();

    if (!selectedTile) {
        selectedTile = {r, c};
        getTileEl(r, c).classList.add('selected');
        audio.select();
    } else {
        if (selectedTile.r === r && selectedTile.c === c) {
            getTileEl(r, c).classList.remove('selected');
            selectedTile = null;
            audio.click();
            return;
        }

        const path = checkMatch(selectedTile.r, selectedTile.c, r, c);
        if (path) {
            audio.match();
            drawPath(path);
            
            const prev = {...selectedTile};
            selectedTile = null;

            setTimeout(() => {
                clearPath();
                board[prev.r][prev.c] = -1;
                board[r][c] = -1;
                
                score += 100;
                updateStats();

                applyGravity();
                renderBoard();

                if (checkWin()) {
                    handleWin();
                } else if (!checkHasValidPair()) {
                    autoShuffle();
                }
            }, 200);
        } else {
            audio.click();
            getTileEl(selectedTile.r, selectedTile.c).classList.remove('selected');
            selectedTile = {r, c};
            getTileEl(r, c).classList.add('selected');
        }
    }
}

function drawPath(path) {
    svgEl.innerHTML = '';
    const rect = gridEl.getBoundingClientRect();
    const boardRect = document.querySelector('.board-outer').getBoundingClientRect();
    
    svgEl.setAttribute('width', boardRect.width);
    svgEl.setAttribute('height', boardRect.height);

    const cellWidth = rect.width / COLS;
    const cellHeight = rect.height / ROWS;
    const offsetX = rect.left - boardRect.left;
    const offsetY = rect.top - boardRect.top;

    let pointsStr = path.map(p => {
        let x = offsetX + (p.c - 0.5) * cellWidth;
        let y = offsetY + (p.r - 0.5) * cellHeight;
        return `${x},${y}`;
    }).join(' ');

    const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    polyline.setAttribute('points', pointsStr);
    polyline.setAttribute('class', 'connector-path');
    svgEl.appendChild(polyline);
}

function clearPath() { svgEl.innerHTML = ''; }

function applyGravity() {
    switch(level) {
        case 2:
            for (let c = 1; c <= COLS; c++) {
                let emptyRow = ROWS;
                for (let r = ROWS; r >= 1; r--) {
                    if (board[r][c] !== -1) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) board[r][c] = -1;
                        emptyRow--;
                    }
                }
            }
            break;
        case 3:
            for (let c = 1; c <= COLS; c++) {
                let emptyRow = 1;
                for (let r = 1; r <= ROWS; r++) {
                    if (board[r][c] !== -1) {
                        board[emptyRow][c] = board[r][c];
                        if (emptyRow !== r) board[r][c] = -1;
                        emptyRow++;
                    }
                }
            }
            break;
        case 4:
            for (let r = 1; r <= ROWS; r++) {
                let emptyCol = 1;
                for (let c = 1; c <= COLS; c++) {
                    if (board[r][c] !== -1) {
                        board[r][emptyCol] = board[r][c];
                        if (emptyCol !== c) board[r][c] = -1;
                        emptyCol++;
                    }
                }
            }
            break;
        case 5:
            for (let r = 1; r <= ROWS; r++) {
                let emptyCol = COLS;
                for (let c = COLS; c >= 1; c--) {
                    if (board[r][c] !== -1) {
                        board[r][emptyCol] = board[r][c];
                        if (emptyCol !== c) board[r][c] = -1;
                        emptyCol--;
                    }
                }
            }
            break;
    }
}

function getTileEl(r, c) { return gridEl.querySelector(`[data-r="${r}"][data-c="${c}"]`); }

function checkHasValidPair() {
    let tiles = [];
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) tiles.push({r, c, type: board[r][c]});
        }
    }
    for (let i = 0; i < tiles.length; i++) {
        for (let j = i + 1; j < tiles.length; j++) {
            if (tiles[i].type === tiles[j].type) {
                if (checkMatch(tiles[i].r, tiles[i].c, tiles[j].r, tiles[j].c)) {
                    return {t1: tiles[i], t2: tiles[j]};
                }
            }
        }
    }
    return null;
}

function shuffleBoard(playSound = true) {
    let activeTypes = [];
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) activeTypes.push(board[r][c]);
        }
    }
    if (activeTypes.length === 0) return;

    do {
        for (let i = activeTypes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [activeTypes[i], activeTypes[j]] = [activeTypes[j], activeTypes[i]];
        }
        let idx = 0;
        for (let r = 1; r <= ROWS; r++) {
            for (let c = 1; c <= COLS; c++) {
                if (board[r][c] !== -1) board[r][c] = activeTypes[idx++];
            }
        }
    } while (!checkHasValidPair() && activeTypes.length > 2);

    if (playSound) audio.shuffle();
    renderBoard();
}

function autoShuffle() {
    if (shuffles > 0) {
        shuffles--;
        updateStats();
        shuffleBoard();
    } else {
        handleGameOver("Bế tắc! Bạn đã hết lượt đổi hình.");
    }
}

function clearHints() { document.querySelectorAll('.tile.hint').forEach(el => el.classList.remove('hint')); }

function checkWin() {
    for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
            if (board[r][c] !== -1) return false;
        }
    }
    return true;
}

function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
        timeLeft--;
        timerBar.style.width = `${(timeLeft / MAX_TIME) * 100}%`;
        if (timeLeft <= 0) {
            clearInterval(timer);
            handleGameOver("Hết giờ rồi!");
        }
    }, 1000);
}

function updateStats() {
    levelTxt.textContent = level;
    scoreTxt.textContent = score;
    hintTxt.textContent = hints;
    shuffleTxt.textContent = shuffles;
}

function handleWin() {
    clearInterval(timer);
    audio.win();
    showModal(`HOÀN THÀNH MÀN ${level}!`, `Điểm của bạn: ${score}`, () => {
        level++;
        startLevel();
    });
}

function handleGameOver(reason) {
    clearInterval(timer);
    audio.fail();
    showModal("GAME OVER", `${reason}\nTổng điểm: ${score}`, () => {
        initGame();
    });
}

function showModal(title, desc, onBtnClick) {
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').innerText = desc;
    const btn = document.getElementById('modal-btn');
    
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    
    newBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        onBtnClick();
    });
    modal.classList.add('active');
}

// CONTROL BUTTONS
document.getElementById('btn-hint').addEventListener('click', () => {
    if (hints <= 0) return;
    const pair = checkHasValidPair();
    if (pair) {
        hints--;
        updateStats();
        clearHints();
        getTileEl(pair.t1.r, pair.t1.c).classList.add('hint');
        getTileEl(pair.t2.r, pair.t2.c).classList.add('hint');
        audio.select();
    }
});

document.getElementById('btn-shuffle').addEventListener('click', () => {
    if (shuffles <= 0) return;
    shuffles--;
    updateStats();
    shuffleBoard();
});

document.getElementById('btn-restart').addEventListener('click', () => {
    initGame();
});
</script>
