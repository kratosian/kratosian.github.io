<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Web Game - Throw Update</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #222;
            border: 4px solid #fff;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #4a90e2, #eef2f3);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
        .health-bar {
            width: 300px;
            height: 20px;
            background: #555;
            border: 2px solid #fff;
            position: relative;
        }
        .health-fill {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.1s;
        }
        #message-box {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: #facc15;
            text-shadow: 3px 3px #000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div>
                <div>Player 1</div>
                <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
            </div>
            <div id="timer">60</div>
            <div>
                <div>Player 2</div>
                <div class="health-bar"><div id="p2-health" class="health-fill" style="background: #ef4444;"></div></div>
            </div>
        </div>
        <div id="message-box">FIGHT!</div>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div id="controls">
        <button onclick="handleAction('attack')">Đấm / Vật (U)</button>
        <button onclick="handleAction('skill1')">Hadouken (I)</button>
        <button onclick="handleAction('skill2')">Shoryuken (O)</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameStarted = true;
    let gameOver = false;
    let gameMode = 'bot'; // Mặc định chơi với Bot

    class Fighter {
        constructor(x, y, color, isP1) {
            this.x = x;
            this.y = y;
            this.width = 50;
            this.height = 100;
            this.color = color;
            this.isP1 = isP1;
            this.health = 100;
            this.velocity = { x: 0, y: 0 };
            this.isAttacking = false;
            this.attackTimer = 0;
            this.facing = isP1 ? "right" : "left";
            this.isJumping = false;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.width, this.height);

            // Vẽ mắt định hướng mặt nhân vật
            ctx.fillStyle = "#fff";
            let eyeX = this.facing === "right" ? this.x + 35 : this.x + 10;
            ctx.fillRect(eyeX, this.y + 20, 10, 10);

            // Hiệu ứng khi đang tấn công/vật
            if (this.isAttacking) {
                ctx.fillStyle = "#f97316";
                let handX = this.facing === "right" ? this.x + this.width : this.x - 30;
                ctx.fillRect(handX, this.y + 40, 30, 15);
            }
        }

        update() {
            this.y += this.velocity.y;
            this.x += this.velocity.x;

            // Trọng lực rơi xuống đất
            if (this.y + this.height < canvas.height - 50) {
                this.velocity.y += 0.6;
                this.isJumping = true;
            } else {
                this.velocity.y = 0;
                this.y = canvas.height - 50 - this.height;
                this.isJumping = false;
            }

            // Giới hạn biên màn hình
            if (this.x < 0) this.x = 0;
            if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

            // Giảm thời gian hồi đòn đánh
            if (this.isAttacking) {
                this.attackTimer--;
                if (this.attackTimer <= 0) {
                    this.isAttacking = false;
                }
            }
        }

        attack() {
            if (this.isAttacking) return false;
            this.isAttacking = true;
            this.attackTimer = 15;
            return true;
        }

        skill(dmg, pushBack, text, color) {
            if (this.isAttacking) return false;
            this.isAttacking = true;
            this.attackTimer = 25;
            showMessage(text, color);
            return true;
        }

        takeDamage(amount) {
            this.health -= amount;
            if (this.health < 0) this.health = 0;
            updateUI();
            if (this.health === 0) {
                gameOver = true;
                showMessage(this.isP1 ? "PLAYER 2 WINS!" : "PLAYER 1 WINS!", "#ef4444");
            }
        }
    }

    const player1 = new Fighter(150, 300, "#3b82f6", true);
    const player2 = new Fighter(600, 300, "#ef4444", false);

    function showMessage(text, color) {
        const msg = document.getElementById("message-box");
        msg.innerText = text;
        msg.style.color = color;
        msg.style.opacity = 1;
        setTimeout(() => {
            msg.style.opacity = 0;
        }, 800);
    }

    function updateUI() {
        document.getElementById("p1-health").style.width = player1.health + "%";
        document.getElementById("p2-health").style.width = player2.health + "%";
    }

    // Xử lý hành động tấn công và Vật (Throw)
    function handleAction(type) {
        if (!gameStarted || gameOver) return;
        let myPlayer = player1;
        let enemyPlayer = player2;
        let skillText = "";

        if (type === 'attack') {
            // Kiểm tra khoảng cách: nếu đứng sát nhau (< 70px) thì thực hiện Đòn Vật (Throw)
            let dist = Math.abs(myPlayer.x - enemyPlayer.x);
            if (dist < 70) {
                skillText = "THROW!";
                if (myPlayer.isAttacking) return;
                myPlayer.isAttacking = true;
                myPlayer.attackTimer = 18;
                showMessage(skillText, "#f97316");
                
                // Gây sát thương và tung đối thủ bay ngược ra sau
                setTimeout(() => {
                    enemyPlayer.takeDamage(15);
                    let pushDir = myPlayer.facing === "right" ? 1 : -1;
                    enemyPlayer.x += pushDir * 70;
                    enemyPlayer.velocity.y = -10; // Nhấc bổng lên không trung
                }, 100);
            } else {
                // Đấm thường nếu ở khoảng cách xa
                if (myPlayer.attack()) {
                    setTimeout(() => checkHit(player1, player2, 10), 80);
                }
            }
        } else if (type === 'skill1') {
            skillText = "HADOUKEN!";
            if (myPlayer.skill(20, 210, skillText, "#38bdf8")) {
                setTimeout(() => checkHit(player1, player2, 20), 120);
            }
        } else if (type === 'skill2') {
            skillText = "SHORYUKEN!";
            if (myPlayer.skill(32, 280, skillText, "#facc15")) {
                setTimeout(() => checkHit(player1, player2, 32), 150);
            }
        }
    }

    function checkHit(attacker, defender, damage) {
        let dist = Math.abs(attacker.x - defender.x);
        if (dist < 70) {
            defender.takeDamage(damage);
            let pushDir = attacker.facing === "right" ? 1 : -1;
            defender.x += pushDir * 30;
        }
    }

    // Điều khiển bàn phím
    window.addEventListener("keydown", (e) => {
        if (gameOver) return;
        if (e.key === "a" || e.key === "A") {
            player1.x -= 10;
            player1.facing = "left";
        } else if (e.key === "d" || e.key === "D") {
            player1.x += 10;
            player1.facing = "right";
        } else if (e.key === "w" || e.key === "W") {
            if (!player1.isJumping) player1.velocity.y = -12;
        } else if (e.key === "u" || e.key === "U") {
            handleAction('attack');
        } else if (e.key === "i" || e.key === "I") {
            handleAction('skill1');
        } else if (e.key === "o" || e.key === "O") {
            handleAction('skill2');
        }
    });

    // Vòng lặp game chính
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vẽ sàn đấu
        ctx.fillStyle = "#333";
        ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

        // Tự động xoay mặt đối đầu nhau
        if (player1.x < player2.x) {
            player1.facing = "right";
            player2.facing = "left";
        } else {
            player1.facing = "left";
            player2.facing = "right";
        }

        player1.update();
        player2.update();

        player1.draw();
        player2.draw();

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
