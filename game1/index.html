<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kratos 1v1 Fighting - Sprite Version</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .game-container {
      position: relative;
      width: 800px;
      height: 450px;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    canvas { background: #1e293b; display: block; }
    .ui-layer {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-group { width: 320px; }
    .bar-container {
      width: 100%;
      height: 20px;
      background: #334155;
      border: 2px solid #fff;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .mp-container {
      height: 12px;
      border-color: #94a3b8;
    }
    .health-bar { height: 100%; width: 100%; transition: width 0.1s ease; }
    .mana-bar { height: 100%; width: 0%; transition: width 0.1s ease; background: #a855f7; }
    #p1-hp { background: #ef4444; }
    #p2-hp { background: #3b82f6; float: right; }
    #p2-mp { float: right; }
    
    .controls-info {
      margin-top: 15px;
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.6;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #38bdf8;
      text-align: center;
      display: none;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <h2 style="margin-bottom: 10px;">KRATOS 1V1 FIGHTING PROTOTYPE</h2>

  <div class="game-container">
    <div class="ui-layer">
      <!-- P1 Status -->
      <div class="status-group">
        <div style="font-weight:bold; margin-bottom:4px; color:#ef4444;">P1: VÕ SĨ</div>
        <div class="bar-container"><div id="p1-hp" class="health-bar"></div></div>
        <div class="bar-container mp-container"><div id="p1-mp" class="mana-bar"></div></div>
      </div>

      <div style="font-size: 20px; font-weight: bold;">VS</div>

      <!-- P2 Status -->
      <div class="status-group">
        <div style="font-weight:bold; margin-bottom:4px; color:#3b82f6; text-align:right;">P2: KIẾM SĨ</div>
        <div class="bar-container"><div id="p2-hp" class="health-bar"></div></div>
        <div class="bar-container mp-container"><div id="p2-mp" class="mana-bar"></div></div>
      </div>
    </div>

    <div id="game-over">
      <h1 id="winner-text" style="color: #facc15; margin-bottom: 10px;">P1 THẮNG!</h1>
      <button onclick="resetGame()">CHƠI LẠI</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <div class="controls-info">
    <b>P1 (Võ sĩ):</b> A/D (Chạy), W (Nhảy), U (Đánh - Tích MP), I (Skill 1 - 30MP), O (Skill 2 - 50MP), P (Chiêu cuối - 80MP)<br>
    <b>P2 (Kiếm sĩ):</b> ←/→ (Chạy), ↑ (Nhảy), Num 1 (Đánh), Num 2 (Skill 1), Num 3 (Skill 2), Num 4 (Chiêu cuối)
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gravity = 0.7;
    const groundY = 380;

    // Load Sprite Sheet Nhân Vật
    const spriteSheet = new Image();
    let isImageLoaded = false;

    spriteSheet.onload = () => { isImageLoaded = true; };
    spriteSheet.onerror = () => {
      // Tự động load tên file gốc nếu file hero.png chưa nhận diện
      if (!spriteSheet.src.includes('3c0ec9cc-f01d-4f87-9ad4-8cf2a52739d5.jpg')) {
        spriteSheet.src = '3c0ec9cc-f01d-4f87-9ad4-8cf2a52739d5.jpg';
      }
    };
    spriteSheet.src = 'hero.png';

    class Player {
      constructor({ x, y, facing, hpId, mpId, spriteCrop, fallbackColor }) {
        this.x = x;
        this.y = y;
        this.width = 65;
        this.height = 95;
        this.velocity = { x: 0, y: 0 };
        this.facing = facing;
        this.hp = 100;
        this.mp = 0;
        this.hpId = hpId;
        this.mpId = mpId;
        this.spriteCrop = spriteCrop;
        this.fallbackColor = fallbackColor;
        this.isAttacking = false;
        this.attackType = 'normal';
        this.attackBox = { x: 0, y: 0, width: 60, height: 40 };
      }

      draw() {
        ctx.save();
        
        if (isImageLoaded || (spriteSheet.complete && spriteSheet.naturalWidth > 0)) {
          // Tính toán vị trí cắt theo tỷ lệ phần trăm kích thước ảnh gốc
          const sx = (this.spriteCrop.x / 100) * spriteSheet.naturalWidth;
          const sy = (this.spriteCrop.y / 100) * spriteSheet.naturalHeight;
          const sw = (this.spriteCrop.w / 100) * spriteSheet.naturalWidth;
          const sh = (this.spriteCrop.h / 100) * spriteSheet.naturalHeight;

          if (this.facing === 'left') {
            ctx.translate(this.x + this.width, this.y);
            ctx.scale(-1, 1);
            ctx.drawImage(spriteSheet, sx, sy, sw, sh, 0, 0, this.width, this.height);
          } else {
            ctx.drawImage(spriteSheet, sx, sy, sw, sh, this.x, this.y, this.width, this.height);
          }
        } else {
          // Hiện khối màu nếu chưa load kịp ảnh
          ctx.fillStyle = this.fallbackColor;
          ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        ctx.restore();

        // Hitbox đòn đánh
        if (this.isAttacking) {
          if (this.attackType === 'normal') ctx.fillStyle = 'rgba(255, 230, 0, 0.5)';
          if (this.attackType === 'skill1') ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
          if (this.attackType === 'skill2') ctx.fillStyle = 'rgba(234, 179, 8, 0.6)';
          if (this.attackType === 'ultimate') ctx.fillStyle = 'rgba(168, 85, 247, 0.7)';

          const boxX = this.facing === 'right' ? this.x + this.width : this.x - this.attackBox.width;
          this.attackBox.x = boxX;
          this.attackBox.y = this.y + 20;
          ctx.fillRect(this.attackBox.x, this.attackBox.y, this.attackBox.width, this.attackBox.height);
        }
      }

      update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;

        if (this.y + this.height + this.velocity.y >= groundY) {
          this.velocity.y = 0;
          this.y = groundY - this.height;
        } else {
          this.velocity.y += gravity;
        }

        if (this.x < 0) this.x = 0;
        if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;

        this.draw();
      }

      attack(type = 'normal', boxWidth = 60, costMP = 0) {
        if (this.isAttacking) return false;
        if (this.mp < costMP) return false;

        this.mp -= costMP;
        this.updateUI();

        this.isAttacking = true;
        this.attackType = type;
        this.attackBox.width = boxWidth;

        setTimeout(() => { this.isAttacking = false; }, 200);
        return true;
      }

      addMP(amount) {
        this.mp = Math.min(100, this.mp + amount);
        this.updateUI();
      }

      takeDamage(amount) {
        this.hp = Math.max(0, this.hp - amount);
        this.addMP(10);
        this.updateUI();
      }

      updateUI() {
        document.getElementById(this.hpId).style.width = this.hp + '%';
        document.getElementById(this.mpId).style.width = this.mp + '%';
      }
    }

    // Thiết lập tọa độ % vị trí cắt khung hình nhân vật
    const player1 = new Player({ 
      x: 150, y: 200, facing: 'right', hpId: 'p1-hp', mpId: 'p1-mp', fallbackColor: '#ef4444',
      spriteCrop: { x: 18, y: 19, w: 13, h: 18 } 
    });

    const player2 = new Player({ 
      x: 610, y: 200, facing: 'left', hpId: 'p2-hp', mpId: 'p2-mp', fallbackColor: '#3b82f6',
      spriteCrop: { x: 68, y: 19, w: 13, h: 18 } 
    });

    const keys = {
      a: false, d: false, w: false,
      ArrowLeft: false, ArrowRight: false, ArrowUp: false
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = true;
      if (e.key === 'd' || e.key === 'D') keys.d = true;
      if (e.key === 'w' || e.key === 'W') keys.w = true;
      
      if (e.key === 'u' || e.key === 'U') {
        if (player1.attack('normal', 60, 0)) checkHit(player1, player2, 10);
      }
      if (e.key === 'i' || e.key === 'I') {
        if (player1.attack('skill1', 90, 30)) checkHit(player1, player2, 20);
      }
      if (e.key === 'o' || e.key === 'O') {
        if (player1.attack('skill2', 120, 50)) checkHit(player1, player2, 30);
      }
      if (e.key === 'p' || e.key === 'P') {
        if (player1.attack('ultimate', 160, 80)) checkHit(player1, player2, 50);
      }

      if (e.key === 'ArrowLeft') keys.ArrowLeft = true;
      if (e.key === 'ArrowRight') keys.ArrowRight = true;
      if (e.key === 'ArrowUp') keys.ArrowUp = true;
      
      if (e.key === '1') {
        if (player2.attack('normal', 60, 0)) checkHit(player2, player1, 10);
      }
      if (e.key === '2') {
        if (player2.attack('skill1', 90, 30)) checkHit(player2, player1, 20);
      }
      if (e.key === '3') {
        if (player2.attack('skill2', 120, 50)) checkHit(player2, player1, 30);
      }
      if (e.key === '4') {
        if (player2.attack('ultimate', 160, 80)) checkHit(player2, player1, 50);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A') keys.a = false;
      if (e.key === 'd' || e.key === 'D') keys.d = false;
      if (e.key === 'w' || e.key === 'W') keys.w = false;

      if (e.key === 'ArrowLeft') keys.ArrowLeft = false;
      if (e.key === 'ArrowRight') keys.ArrowRight = false;
      if (e.key === 'ArrowUp') keys.ArrowUp = false;
    });

    function checkHit(attacker, defender, damage) {
      const boxX = attacker.facing === 'right' ? attacker.x + attacker.width : attacker.x - attacker.attackBox.width;
      const boxY = attacker.y + 20;

      if (
        boxX < defender.x + defender.width &&
        boxX + attacker.attackBox.width > defender.x &&
        boxY < defender.y + defender.height &&
        boxY + attacker.attackBox.height > defender.y
      ) {
        defender.takeDamage(damage);
        attacker.addMP(15);

        if (defender.hp === 0) {
          document.getElementById('winner-text').innerText = (attacker === player1 ? 'P1 (VÕ SĨ)' : 'P2 (KIẾM SĨ)') + ' THẮNG!';
          document.getElementById('game-over').style.display = 'block';
        }
      }
    }

    function resetGame() {
      player1.hp = 100; player1.mp = 0; player1.x = 150;
      player2.hp = 100; player2.mp = 0; player2.x = 610;
      player1.updateUI();
      player2.updateUI();
      document.getElementById('game-over').style.display = 'none';
      animate();
    }

    let animationId;
    function animate() {
      animationId = requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sàn đấu
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // Điều khiển P1
      player1.velocity.x = 0;
      if (keys.a) { player1.velocity.x = -4; player1.facing = 'left'; }
      if (keys.d) { player1.velocity.x = 4; player1.facing = 'right'; }
      if (keys.w && player1.y + player1.height >= groundY) player1.velocity.y = -14;

      // Điều khiển P2
      player2.velocity.x = 0;
      if (keys.ArrowLeft) { player2.velocity.x = -4; player2.facing = 'left'; }
      if (keys.ArrowRight) { player2.velocity.x = 4; player2.facing = 'right'; }
      if (keys.ArrowUp && player2.y + player2.height >= groundY) player2.velocity.y = -14;

      player1.update();
      player2.update();

      if (player1.hp === 0 || player2.hp === 0) {
        cancelAnimationFrame(animationId);
      }
    }

    animate();
  </script>
</body>
</html>
